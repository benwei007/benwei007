var SNAP_T = 6;
function computeSnap(el) {
  var elX = [el.x, el.x + el.w / 2, el.x + el.w];
  var elY = [el.y, el.y + el.h / 2, el.y + el.h];
  var vt = [0, state.width / 2, state.width];
  var ht = [0, state.height / 2, state.height];
  state.elements.forEach(function(o) {
    if (o.id === el.id || o.hidden) return;
    vt.push(o.x, o.x + o.w / 2, o.x + o.w);
    ht.push(o.y, o.y + o.h / 2, o.y + o.h);
  });
  var bestX = null, bestDX = SNAP_T + 1, bestXi = -1;
  var bestY = null, bestDY = SNAP_T + 1, bestYi = -1;
  vt.forEach(function(t) {
    elX.forEach(function(e, i) {
      var d = Math.abs(e - t);
      if (d < bestDX) { bestDX = d; bestX = t; bestXi = i; }
    });
  });
  ht.forEach(function(t) {
    elY.forEach(function(e, i) {
      var d = Math.abs(e - t);
      if (d < bestDY) { bestDY = d; bestY = t; bestYi = i; }
    });
  });
  var lines = [];
  if (bestX != null) {
    var offX = [0, el.w / 2, el.w][bestXi];
    el.x = Math.round(bestX - offX);
    lines.push({ v: bestX });
  }
  if (bestY != null) {
    var offY = [0, el.h / 2, el.h][bestYi];
    el.y = Math.round(bestY - offY);
    lines.push({ h: bestY });
  }
  return lines;
}

function buildEl(el){

    node=document.createElement("div");
    node.style.cssText="border-radius:50%;overflow:hidden;width:100%;height:100%;"+(el.borderWidth>0?"border:"+el.borderWidth+"px solid "+(el.borderColor||"#8B7BC4")+";box-sizing:border-box;":"");
    if(el.localSrc||el.src){var im2=document.createElement("img");im2.src=el.localSrc||el.src;im2.style.cssText="width:100%;height:100%;object-fit:cover;display:block;";im2.draggable=false;node.appendChild(im2)}else{node.style.background=el.fill||"#C3BDE4"}
  }else if(el.type==="rect"){
    node=document.createElement("div");
    node.style.cssText="border:"+(el.strokeWidth||2)+"px solid "+(el.stroke||"#8B7BC4")+";background:"+(el.fill||"transparent")+";box-sizing:border-box;"+(el.borderRadius>0?"border-radius:"+el.borderRadius+"px;":"");
  }else if(el.type==="line"){
    node=document.createElement("div");
    node.style.cssText="width:100%;height:100%;position:relative;";
    var l=document.createElement("div");
    l.style.cssText="position:absolute;left:0;top:50%;width:100%;height:"+(el.strokeWidth||3)+"px;background:"+(el.stroke||"#8B7BC4")+";transform:translateY(-50%);border-radius:2px";
    node.appendChild(l);
  }
  node.classList.add("elem");
  applyElStyle(node,el);
  node.dataset.id=el.id;
  if(el.locked)node.classList.add("locked");
  if(el.hidden)node.classList.add("hidden-elem");
  if(state.selected===el.id)node.classList.add("selected");
  if(state.selected===el.id&&!el.locked){var h1=document.createElement("div");h1.className="handle br";node.appendChild(h1);var h2=document.createElement("div");h2.className="handle rot";node.appendChild(h2)}

}
function applyElStyle(node,el){
    node.style.left=el.x+"px";

function rebuildStage(){

function undo(){if(hStep>0){hStep--;var d=JSON.parse(history[hStep]);state.elements=d.els;state.width=d.w;state.height=d.h;state.bgColor=d.bg;state.bgImage=d.img;state.bgLocal=d.limg||"";state.transparent=!!d.tp;state.coverImage=d.cover||"";state.bgScale=d.scale||100;state.bgOpacity=d.opacity||100;state.selected=null;rebuildStage();renderSide();updateUndoRedo()}}

function getXY(e){var r=stage.getBoundingClientRect();var cx=e.clientX||(e.touches&&e.touches[0].clientX)||(e.changedTouches&&e.changedTouches[0].clientX);var cy=e.clientY||(e.touches&&e.touches[0].clientY)||(e.changedTouches&&e.changedTouches[0].clientY);return{x:cx-r.left,y:cy-r.top}}

function customImageSelect(cb){
  var modal=document.getElementById("imgModal");
  var inputUrl=document.getElementById("modalImgUrl");
  modal.style.display="flex";
  inputUrl.value="";
  function close(){ modal.style.display="none"; }
  document.getElementById("modalCancel").onclick=close;
  document.getElementById("modalPickLocal").onclick=function(){
    close();
    var input=document.createElement("input");input.type="file";input.accept="image/*";
    input.onchange=function(e){
      var f=e.target.files[0];if(!f)return;
      var r=new FileReader();
      r.onload=function(ev){
        var img=new Image();
        img.onload=function(){
          var maxW = 1920, maxH = 1920;
          var w = img.width, h = img.height;
          var ratio = w / h;
          if (w > maxW || h > maxH) {
              if (w / maxW > h / maxH) { w = maxW; h = w / ratio; } 
              else { h = maxH; w = h * ratio; }
              var canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
              canvas.getContext("2d").drawImage(img,0,0,w,h);
              cb(canvas.toDataURL("image/jpeg",0.95));
          } else { cb(ev.target.result); }
        };
        img.src=ev.target.result;
      };
      r.readAsDataURL(f);
    };
    input.click();
  };
  document.getElementById("modalPickUrl").onclick=function(){
    var url=inputUrl.value.trim();
    if(!url){toast("请输入图片链接");return}
    close();
    var img=new Image();
    img.onload=function(){
      var maxW = 1920, maxH = 1920;
      var w = img.width, h = img.height;
      var ratio = w / h;
      if (w > maxW || h > maxH) {
          if (w / maxW > h / maxH) { w = maxW; h = w / ratio; } 
          else { h = maxH; w = h * ratio; }
      }
      cb({url:url, w:w, h:h});
    };
    img.onerror=function(){ cb(url); };
    img.src=url;
  };
}

function renderLayers(){
  layerList.innerHTML="";
  if(state.elements.length===0){layerList.innerHTML='<div style="text-align:center;color:#A99BC4;font-size:12px;padding:20px">暂无图层</div>';return}
  var sorted=state.elements.slice().sort(function(a,b){return (b.z||0)-(a.z||0)});
  sorted.forEach(function(el){
    var label = el.name ? el.name : (el.text ? el.text.substring(0,10) : (el.type==="image"?"图片":el.type==="circle"?"圆图":el.type==="rect"?"矩形":el.type==="line"?"直线":"元素"));
    var lockIcon = el.locked ? "锁" : "解";
    var visIcon = el.hidden ? "隐" : "显";
    var item=document.createElement("div");
    item.className="layer-item";
    item.draggable=true;
    item.dataset.id=el.id;
    item.innerHTML='<div class="layer-thumb">'+(el.type==="image"&&(el.localSrc||el.src)?'<img src="'+esc(el.localSrc||el.src)+'">':(el.type==="text"?"T":el.type==="rect"?"矩":el.type==="circle"?"圆":el.type==="line"?"线":"图"))+'</div><div class="layer-name">'+esc(label)+'</div><button class="layer-lock" data-lock="'+el.id+'" title="锁定/解锁">'+lockIcon+'</button><button class="layer-vis" data-vis="'+el.id+'" title="显示/隐藏">'+visIcon+'</button><button class="layer-del" data-del="'+el.id+'">X</button>';
    layerList.appendChild(item);
  });

  var draggedId=null;
  var lastTargetId=null;
  var isAfter=false;

  layerList.querySelectorAll(".layer-item").forEach(function(item){
    item.addEventListener("dragstart",function(e){
      draggedId=item.dataset.id;
      lastTargetId=null;
      isAfter=false;
      item.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData('text/plain', draggedId);
    });
    item.addEventListener("dragend",function(){
      item.classList.remove("dragging");
      layerList.querySelectorAll('.layer-item').forEach(function(el){ el.classList.remove('drag-over-top', 'drag-over-bottom'); });
      if(!draggedId) return;
      var draggedEl = state.elements.find(function(x){ return x.id === draggedId; });
      if (!draggedEl) { draggedId = null; return; }
      if (!lastTargetId || lastTargetId === draggedId) {
          var oldIndex = state.elements.indexOf(draggedEl);
          state.elements.splice(oldIndex, 1);
          state.elements.push(draggedEl);
      } else {
          var targetEl = state.elements.find(function(x){ return x.id === lastTargetId; });
          if (targetEl) {
              var oldIndex = state.elements.indexOf(draggedEl);
              state.elements.splice(oldIndex, 1);
              var targetIndex = state.elements.indexOf(targetEl);
              if (isAfter) { state.elements.splice(targetIndex + 1, 0, draggedEl); }
              else { state.elements.splice(targetIndex, 0, draggedEl); }
          }
      }
      state.elements.forEach(function(el, i) { el.z = i; });
      state.elements.forEach(function(el) {
          var node = stage.querySelector('[data-id="' + el.id + '"]');
          if (node) node.style.zIndex = el.z + 1;
      });
      var sorted = state.elements.slice().sort(function(a,b){ return (b.z||0)-(a.z||0); });
      sorted.forEach(function(el) {
          var node = layerList.querySelector('[data-id="' + el.id + '"]');
          if (node) layerList.appendChild(node);
      });
      renderSide();
      draggedId = null;
      lastTargetId = null;
    });
    item.addEventListener("dragover",function(e){
      e.preventDefault();
      if(!draggedId || item.dataset.id===draggedId) return;
      if (lastTargetId !== item.dataset.id) {
          layerList.querySelectorAll('.layer-item').forEach(function(el){ el.classList.remove('drag-over-top', 'drag-over-bottom'); });
          lastTargetId = item.dataset.id;
          var rect = item.getBoundingClientRect();
          isAfter = (e.clientY - rect.top) / rect.height > 0.5;
          if(isAfter){ item.classList.add('drag-over-bottom'); } 
          else { item.classList.add('drag-over-top'); }
      }
      e.dataTransfer.dropEffect = "move";
    });
    item.addEventListener('drop', function(e) { e.preventDefault(); });
  });
  
  layerList.querySelectorAll(".layer-del").forEach(function(btn){
    btn.addEventListener("click",function(e){
      e.stopPropagation();
      var id=btn.dataset.del;
      state.elements=state.elements.filter(function(x){return x.id!==id});
      if(state.selected===id)state.selected=null;
      rebuildStage();renderSide();pushHistory();
    });
  });
  layerList.querySelectorAll(".layer-lock").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var id = btn.dataset.lock;
      var el = state.elements.find(function(x){return x.id === id});
      if (el) {
        el.locked = !el.locked;
        if (el.locked && state.selected === id) state.selected = null;
        rebuildStage(); renderLayers(); renderSide(); pushHistory();
      }
    });
  });
  layerList.querySelectorAll(".layer-vis").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var id = btn.dataset.vis;
      var el = state.elements.find(function(x){return x.id === id});
      if (el) {
        el.hidden = !el.hidden;
        if (el.hidden && state.selected === id) state.selected = null;
        rebuildStage(); renderLayers(); renderSide(); pushHistory();
      }
    });
  });
}

document.getElementById("importBtn").addEventListener("click", function() {
  var input = document.createElement("input");
  input.type = "file";
  input.accept = ".html,.txt,.json,.docx,.doc";
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    if (file.name.endsWith('.docx') || file.name.endsWith('.doc')) {
       toast("暂不支持直接解析 Word 文档，请复制内容粘贴");
       return;
    }
    var r = new FileReader();
    r.onload = function(ev) {
      var content = ev.target.result;
      var wMatch = content.match(/width:\s*(\d+)px/i);
      var hMatch = content.match(/height:\s*(\d+)px/i);
      if (wMatch && hMatch) {
        state.width = parseInt(wMatch[1]);
        state.height = parseInt(hMatch[1]);
        toast("已按代码修改画布尺寸为 " + state.width + "x" + state.height);
        rebuildStage();
      } else {
        var jsonMatch = content.match(/"w":\s*(\d+).*?"h":\s*(\d+)/);
        if (jsonMatch) {
           state.width = parseInt(jsonMatch[1]);
           state.height = parseInt(jsonMatch[2]);
           toast("已按数据修改画布尺寸为 " + state.width + "x" + state.height);
           rebuildStage();
        } else {
           toast("未能识别代码中的画布尺寸，已保持原尺寸");
        }
      }
    };
    r.readAsText(file);
  };
  input.click();
});

function onStart(e){
  if(isPointerDown) return;
  isPointerDown = true;
  if(e.touches&&e.touches.length>1){isPointerDown=false;return;}
  var p=getXY(e);
  var target=e.target.closest(".elem");
  if(state.tool==="hand"){
    panState.isPanning=true;
    panState.startX=e.clientX||(e.touches&&e.touches[0].clientX);
    panState.startY=e.clientY||(e.touches&&e.touches[0].clientY);
    panState.scrollLeft=canvasWrap.scrollLeft;
    panState.scrollTop=canvasWrap.scrollTop;
    canvasWrap.style.cursor="grabbing";
    if(e.touches)e.preventDefault();
    return;
  }
  if(state.tool==="select"){
    if(target){
      var id=target.dataset.id;var el=state.elements.find(function(x){return x.id===id});
      if(!el||el.locked){isPointerDown=false;return;}
      state.selected=el.id;rebuildStage();renderSide();
    } else {
      state.selected=null;rebuildStage();renderSide();
    }
    isPointerDown=false;
    return;
  }
  if(state.tool==="move"){
    if(!target || target.dataset.id !== state.selected) {
        if(target && target.dataset.id !== state.selected) { toast("移动模式下无法切换元素，请先用选择工具选中"); }
        isPointerDown = false;
        return;
    }
    var el = state.elements.find(function(x){return x.id===state.selected});
    if(!el || el.locked) { isPointerDown=false; return; }
    if(e.target.classList.contains("handle")&&e.target.classList.contains("br")){if(e.touches)e.preventDefault();drag={mode:"resize",el:el,sx:p.x,sy:p.y,sw:el.w,sh:el.h,ratio:(el.initW||el.w)/(el.initH||el.h)}}
    else if(e.target.classList.contains("handle")&&e.target.classList.contains("rot")){if(e.touches)e.preventDefault();drag={mode:"rotate",el:el,cx:el.x+el.w/2,cy:el.y+el.h/2}}
    else{if(e.touches)e.preventDefault();drag={mode:"move",el:el,sx:p.x,sy:p.y,ex:el.x,ey:el.y,origX:el.x,origY:el.y}}
    return;
  }
  if(state.tool!=="select" && state.tool!=="hand" && state.tool!=="move"){
    if(drag) { isPointerDown=false; return; }
    var type=state.tool;var el=createElAt(type,p.x,p.y);
    if(type==="image"||type==="circle"){
      customImageSelect(function(data){
        if(typeof data === 'string') { el.localSrc=data; el.w=200; el.h=200; }
        else { el.localSrc=data.url || ""; el.w=data.w || 200; el.h=data.h || 200; }
        el.initW = el.w; el.initH = el.h;
        clampPos(el); 
        state.elements.push(el);state.selected=el.id;
        rebuildStage();renderSide();pushHistory();
        setTool("select");
      });
      isPointerDown=false;
      return;
    }
    clampPos(el); 
    state.elements.push(el);state.selected=el.id;
    rebuildStage();renderSide();pushHistory();
    setTool("select");
    drag={mode:"move",el:el,sx:p.x,sy:p.y,ex:el.x,ey:el.y,origX:el.x,origY:el.y};
  }
}

function onMove(e){
  if(panState.isPanning){
    var cx=e.clientX||(e.touches&&e.touches[0].clientX);
    var cy=e.clientY||(e.touches&&e.touches[0].clientY);
    var dx=cx-panState.startX;
    var dy=cy-panState.startY;
    canvasWrap.scrollLeft=panState.scrollLeft-dx;
    canvasWrap.scrollTop=panState.scrollTop-dy;
    if(e.touches)e.preventDefault();
    return;
  }
  if(!drag)return;
  if(e.touches)e.preventDefault();
  var p=getXY(e);
  if(drag.mode==="move"){
      var nx=drag.ex+(p.x-drag.sx);
      var ny=drag.ey+(p.y-drag.sy);
      drag.el.x=nx; drag.el.y=ny;
      var lines = computeSnap(drag.el);
      clampPos(drag.el);
      updateElPos(drag.el);
      drawGuides(lines);
  }
  else if(drag.mode==="resize"){
      var nw, nh;
      if (e.shiftKey && drag.ratio && isFinite(drag.ratio)) {
        var dx = p.x - drag.sx, dy = p.y - drag.sy;
        var delta = Math.abs(dx) > Math.abs(dy) ? dx : dy * drag.ratio;
        nw = Math.max(20, drag.sw + delta);
        nh = Math.max(20, nw / drag.ratio);
      } else {
        nw = Math.max(20, drag.sw + (p.x - drag.sx));
        nh = Math.max(20, drag.sh + (p.y - drag.sy));
      }
      drag.el.w=nw; drag.el.h=nh; drag.el.initW=nw; drag.el.initH=nh;
      updateElPos(drag.el);
  }
  else if(drag.mode==="rotate"){var ang=Math.atan2(p.y-drag.cy,p.x-drag.cx)*180/Math.PI+90;drag.el.rotation=Math.round(ang);updateElPos(drag.el)}
}

function onEnd(){
  isPointerDown = false;
  clearGuides();
  if(panState.isPanning){panState.isPanning=false;canvasWrap.style.cursor="grab";return}
  if(drag){pushHistory();drag=null;renderSide()}
}

// ===== 键盘快捷键 =====
var arrowPushTimer = null;
function isEditingField() {
  var t = document.activeElement;
  if (!t) return false;
  var tag = t.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable;
}
document.addEventListener('keydown', function(e){
  if (isEditingField()) return;
  var sel = state.elements.find(function(x){return x.id === state.selected});

  if (e.key === 'Escape') {
    if (state.selected) { state.selected = null; rebuildStage(); renderSide(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault(); redo(); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    if (!sel) return;
    e.preventDefault();
    var c = cloneEl(sel); c.id = uid();
    c.x = Math.min(state.width - c.w, c.x + 20);
    c.y = Math.min(state.height - c.h, c.y + 20);
    c.z = state.elements.length;
    state.elements.push(c); state.selected = c.id;
    rebuildStage(); renderSide(); pushHistory();
    toast('已复制');
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
    if (!sel) return;
    e.preventDefault();
    window.__cvClipboard = cloneEl(sel);
    toast('已复制到剪贴板');
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
    if (!window.__cvClipboard) return;
    e.preventDefault();
    var c2 = cloneEl(window.__cvClipboard); c2.id = uid();
    c2.x = Math.min(state.width - c2.w, c2.x + 20);
    c2.y = Math.min(state.height - c2.h, c2.y + 20);
    c2.z = state.elements.length;
    state.elements.push(c2); state.selected = c2.id;
    rebuildStage(); renderSide(); pushHistory();
    toast('已粘贴');
    return;
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel) {
    e.preventDefault();
    state.elements = state.elements.filter(function(x){return x.id !== sel.id});
    state.selected = null;
    rebuildStage(); renderSide(); pushHistory();
    return;
  }
  if (sel && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    var step = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft') sel.x -= step;
    if (e.key === 'ArrowRight') sel.x += step;
    if (e.key === 'ArrowUp') sel.y -= step;
    if (e.key === 'ArrowDown') sel.y += step;
    clampPos(sel);
    updateElPos(sel);
    clearTimeout(arrowPushTimer);
    arrowPushTimer = setTimeout(function(){ pushHistory(); }, 400);
    return;
  }
}, true);

  function ensureFullHtml(code, title, coverImage) {
    const t = (code||'').trim();
    if (!t) return '';
    let imgHtml = coverImage ? '<img src="' + coverImage + '" alt="cover" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto; border:1px solid #EBE6F4; border-radius:4px;">' : '';
    
    if (/<html[\s>]/i.test(t) || /<body[\s>]/i.test(t)) {
        if (imgHtml) {
            if (/<body[^>]*>/i.test(t)) {
                return t.replace(/<body([^>]*)>/i, '<body$1>\n' + imgHtml + '\n');
            } else if (/<html[^>]*>/i.test(t)) {
                return t.replace(/<html([^>]*)>/i, '<html$1>\n<body>\n' + imgHtml + '\n');
            }
        }
        return t;
    }
    return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>' + esc(title||'Code') + '</title>\n</head>\n<body>\n' + imgHtml + '\n' + t + '\n</body>\n</html>';
  }

  // =====================================================================
  //  ★★★ 生成真正的 .docx（OOXML 格式，微信/QQ/Word/WPS 都能正常打开）★★★
  // =====================================================================
  function xmlEsc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }
  function stripCtl(s) {
    return String(s == null ? '' : s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  }

  function buildDocxBlob(code, title) {
    return new Promise(function(resolve, reject) {
      loadJSZip(function() {
        try {
          const JSZipCtor = getJSZip();
          if (!JSZipCtor) { reject(new Error('JSZip 未就绪')); return; }
          const zip = new JSZipCtor();

          zip.file('[Content_Types].xml',
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
            '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
            '<Default Extension="xml" ContentType="application/xml"/>' +
            '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
            '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
            '</Types>'
          );

          zip.file('_rels/.rels',
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
            '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
            '</Relationships>'
          );

          zip.file('word/_rels/document.xml.rels',
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
            '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
            '</Relationships>'
          );

          zip.file('word/styles.xml',
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
            '<w:docDefaults><w:rPrDefault><w:rPr>' +
            '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:eastAsia="Microsoft YaHei"/>' +
            '<w:sz w:val="20"/>' +
            '</w:rPr></w:rPrDefault></w:docDefaults>' +
            '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
            '</w:styles>'
          );

          let body = '';

          const safeTitle = stripCtl(title || 'Code');
          body += '<w:p><w:pPr><w:spacing w:before="0" w:after="240"/></w:pPr>' +
                  '<w:r><w:rPr><w:rFonts w:ascii="Microsoft YaHei" w:hAnsi="Microsoft YaHei" w:eastAsia="Microsoft YaHei"/>' +
                  '<w:b/><w:sz w:val="36"/><w:color w:val="4A3B7A"/></w:rPr>' +
                  '<w:t xml:space="preserve">' + xmlEsc(safeTitle) + '</w:t></w:r></w:p>';

          const text = stripCtl(String(code || ''));
          const lines = text.split(/\r\n|\r|\n/);
          lines.forEach(function(line) {
            if (line === '') {
              body += '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:p>';
            } else {
              body += '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr>' +
                      '<w:r><w:rPr>' +
                      '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:eastAsia="Microsoft YaHei"/>' +
                      '<w:sz w:val="18"/><w:color w:val="2D2440"/>' +
                      '</w:rPr>' +
                      '<w:t xml:space="preserve">' + xmlEsc(line) + '</w:t></w:r></w:p>';
            }
          });

          body += '<w:sectPr>' +
                  '<w:pgSz w:w="11906" w:h="16838"/>' +
                  '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="720" w:footer="720" w:gutter="0"/>' +
                  '</w:sectPr>';

          zip.file('word/document.xml',
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
            '<w:body>' + body + '</w:body>' +
            '</w:document>'
          );

          zip.generateAsync({
            type: 'blob',
            mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
            compression: 'DEFLATE',
            compressionOptions: { level: 6 }
          }).then(function(blob) {
            resolve(blob);
          }).catch(reject);
        } catch (e) { reject(e); }
      });
    });
  }

  function triggerDownloadBlob(blob, filename) { try { const url = URL.createObjectURL(blob); const a = rootDoc.createElement('a'); a.href = url; a.download = filename; a.style.cssText = 'position:fixed;left:-9999px;top:0;'; rootDoc.body.appendChild(a); a.click(); setTimeout(() => { try { rootDoc.body.removeChild(a); } catch(e) {} URL.revokeObjectURL(url); }, 2000); return true; } catch(e) { return false; } }
  function downloadHtml(s, f) { return triggerDownloadBlob(new Blob([ensureFullHtml(getSnippetHtml(s), s.name, s.coverImage)], {type:'text/html;charset=utf-8'}), f); }

  function downloadWord(s, f) {
    const fn = String(f || 'index.docx').replace(/\.docx?$/i, '.docx').replace(/\.html?$/i, '.docx');
    return buildDocxBlob(getSnippetHtml(s), s.name).then(function(blob) {
      const ok = triggerDownloadBlob(blob, fn);
      if (!ok) throw new Error('下载被阻止');
      return fn;
    });
  }

  function openExportConfirm(snippet) {
    const s = snippet || getActive(); if (!s) return;
    const code = ensureFullHtml(getSnippetHtml(s), s.name, s.coverImage); if (!code) { showToast('空的'); return; }
    const def = (s.name||'code').replace(/\.(html?|docx?|txt)$/i, '');
    const size = new Blob([code]).size;
    const mask = document.createElement('div');
    mask.className = 'cv-modal-mask';
    mask.innerHTML = '<div class="cv-modal wide"><div class="cv-modal-title">导出文件</div><div class="exp-section"><div class="exp-label"><span>文件名</span><span>扩展名自动添加</span></div><div class="filename-row"><span class="prefix">文件</span><input type="text" id="expFilename" value="' + esc(def) + '" maxlength="60"><span class="suffix" id="expSuffix">.html</span></div></div><div class="exp-section"><div class="exp-label"><span>代码预览</span><span>' + (size/1024).toFixed(2) + ' KB</span></div><div class="code-preview">' + esc(code) + '</div></div><div class="cv-modal-actions"><button type="button" data-r="cancel">取消</button><div class="spacer"></div><button type="button" id="expDownloadHtmlBtn" class="primary">下载 HTML</button><button type="button" id="expDownloadWordBtn" class="primary" style="margin-left:6px">下载 Word (.docx)</button></div></div>';
    shadow.appendChild(mask);
    const fi = mask.querySelector('#expFilename'); fi.focus(); fi.select();
    const suffixEl = mask.querySelector('#expSuffix');
    const wordBtn = mask.querySelector('#expDownloadWordBtn');

    const setSuffix = (t) => { suffixEl.textContent = t; };
    fi.addEventListener('focus', () => setSuffix('.html'));
    wordBtn.addEventListener('mouseenter', () => setSuffix('.docx'));

    mask.querySelector('#expDownloadHtmlBtn').addEventListener('click', () => { 
      const raw = fi.value.trim(); if (!raw) { fi.focus(); return; } 
      const fn = normalizeFilename(raw, '.html'); 
      if (downloadHtml(s, fn)) { showToast('已下载 HTML：'+fn); mask.remove(); } 
    });

    wordBtn.addEventListener('click', function() {
      const raw = fi.value.trim(); 
      if (!raw) { fi.focus(); return; }
      const fn = normalizeFilename(raw, '.docx');
      wordBtn.disabled = true;
      const oldText = wordBtn.textContent;
      wordBtn.textContent = '生成中...';
      downloadWord(s, fn).then(function() {
        showToast('已下载 Word：' + fn);
        mask.remove();
      }).catch(function(err) {
        wordBtn.disabled = false;
        wordBtn.textContent = oldText;
        showToast('生成 Word 失败：' + err.message);
      });

    mask.querySelector('[data-r="cancel"]').addEventListener('click', () => mask.remove());
    fi.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); mask.querySelector('#expDownloadHtmlBtn').click(); } else if (e.key === 'Escape') { e.preventDefault(); mask.remove(); } });
    mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
  }

  function openExportPanel() {
    if (!state.snippets.length) { showToast('没有可导出'); return; }
    const mask = document.createElement('div');
    mask.className = 'cv-modal-mask';
    mask.innerHTML = '<div class="cv-modal wide"><div class="cv-modal-title">选择要导出的代码</div><div class="exp-topbar"><label><input type="checkbox" id="expSelectAll"><span>全选</span></label><div class="spacer"></div><div class="count" id="expCount">已选 0 个</div></div><div class="exp-list" id="expList"></div><div class="cv-modal-actions"><button type="button" data-r="cancel">取消</button><div class="spacer"></div><button type="button" id="expSelectedHtmlBtn" class="primary">导出 HTML</button><button type="button" id="expSelectedWordBtn" class="primary" style="margin-left:6px">导出 Word (.docx)</button><button type="button" id="expZipBtn" class="primary" style="margin-left:6px; background:var(--accent-ink); border-color:var(--accent-ink);">⬇ 打包为 ZIP</button></div></div>';
    shadow.appendChild(mask);
    const listEl = mask.querySelector('#expList'), selectAllCb = mask.querySelector('#expSelectAll'), countEl = mask.querySelector('#expCount');
    const sorted = state.snippets.slice().sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
    listEl.innerHTML = sorted.map(s => { const cat = state.categories.find(c => c.id === s.catId); const cn = cat ? cat.name : '未分类'; const isC = s.type === 'collage'; return '<div class="exp-item" data-id="' + s.id + '"><input type="checkbox" class="exp-cb" data-id="' + s.id + '"><span class="ename">' + esc(s.name) + (isC?' [拼贴]':'') + '</span><span class="ecat">' + esc(cn) + '</span><button type="button" class="ebtn" data-single="' + s.id + '">导出</button></div>'; }).join('');
    function uc() { const c = listEl.querySelectorAll('.exp-cb:checked').length; countEl.textContent = '已选 ' + c + ' / ' + sorted.length; selectAllCb.checked = c === sorted.length && sorted.length > 0; selectAllCb.indeterminate = c > 0 && c < sorted.length; }
    selectAllCb.addEventListener('change', () => { listEl.querySelectorAll('.exp-cb').forEach(cb => { cb.checked = selectAllCb.checked; }); uc(); });
    listEl.addEventListener('change', e => { if (e.target.classList.contains('exp-cb')) uc(); });
    listEl.addEventListener('click', e => { const b = e.target.closest('[data-single]'); if (!b) return; e.stopPropagation(); const s = state.snippets.find(x => x.id === b.dataset.single); if (!s) return; mask.remove(); setTimeout(() => openExportConfirm(s), 150); });
    function batch(fmt) {
      const ids = Array.from(listEl.querySelectorAll('.exp-cb:checked')).map(cb => cb.dataset.id);
      if (!ids.length) { showToast('请先勾选'); return; }
      const sel = ids.map(id => state.snippets.find(x => x.id === id)).filter(Boolean);
      mask.remove();
      if (sel.length === 1) { setTimeout(() => openExportConfirm(sel[0]), 150); return; }
      const isW = fmt === 'word';
      const m2 = document.createElement('div');
      m2.className = 'cv-modal-mask';
      m2.innerHTML = '<div class="cv-modal wide"><div class="cv-modal-title">批量导出 ' + sel.length + ' 个 ' + (isW?'Word (.docx)':'HTML') + ' 文件</div><div class="cv-modal-msg">浏览器会依次下载，可能弹出"是否允许下载多个文件"的提示。</div><div class="cv-modal-actions"><button type="button" data-r="cancel">取消</button><div class="spacer"></div><button type="button" id="batchDl" class="primary">全部下载</button></div></div>';
      shadow.appendChild(m2);
      m2.querySelector('#batchDl').addEventListener('click', function() {
        m2.remove();
        if (isW) {
          let idx = 0;
          function next() {
            if (idx >= sel.length) return;
            const s = sel[idx++];
            const fn = normalizeFilename(s.name, '.docx');
            downloadWord(s, fn).then(function() {
              setTimeout(next, 500);
            }).catch(function() {
              setTimeout(next, 500);
            });
          }
          next();
        } else {
          sel.forEach((s, i) => setTimeout(() => {
            const fn = normalizeFilename(s.name, '.html');
            downloadHtml(s, fn);
          }, i * 400));
        }
      });
      m2.querySelector('[data-r="cancel"]').addEventListener('click', () => m2.remove());
      m2.addEventListener('click', e => { if (e.target === m2) m2.remove(); });
    }
    mask.querySelector('#expSelectedHtmlBtn').addEventListener('click', () => batch('html'));
    mask.querySelector('#expSelectedWordBtn').addEventListener('click', () => batch('word'));

    mask.querySelector('#expZipBtn').addEventListener('click', function() {
      const ids = Array.from(listEl.querySelectorAll('.exp-cb:checked')).map(cb => cb.dataset.id);
      if (!ids.length) { showToast('请先勾选'); return; }
      const sel = ids.map(id => state.snippets.find(x => x.id === id)).filter(Boolean);
      if (!sel.length) return;

      mask.remove();
      showToast('正在打包...');

      loadJSZip(function() {
        const JSZipCtor = getJSZip();
        if (!JSZipCtor) { showToast('打包库未就绪'); return; }
        const zip = new JSZipCtor();
        const usedNames = {};
        const tasks = [];

        sel.forEach(function(s) {
          let baseName = (s.name || 'code').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'code';
          let fn = baseName + '.docx';
          if (usedNames[fn]) {
            usedNames[fn]++;
            fn = baseName + '_' + usedNames[fn] + '.docx';
          } else {
            usedNames[fn] = 1;
          }
          tasks.push(buildDocxBlob(getSnippetHtml(s), s.name).then(function(blob) {
            zip.file(fn, blob);
          }));
        });

        Promise.all(tasks).then(function() {
          return zip.generateAsync({ type: 'blob' });
        }).then(function(blob) {
          const zipName = '代码备份_' + new Date().toISOString().slice(0, 10) + '.zip';
          triggerDownloadBlob(blob, zipName);
          showToast('已下载 ZIP：' + zipName);
        }).catch(function(err) {
          console.error(err);
          showToast('打包失败：' + err.message);
        });
      });
    });

    mask.querySelector('[data-r="cancel"]').addEventListener('click', () => mask.remove());
    mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
    uc();
  }

  function showGallery() { state.view = 'gallery'; galleryView.classList.remove('hide'); editorView.classList.add('hide'); setTopTitle(TOP_TITLE, state.snippets.length + ' 个片段'); renderCatBar(); renderGallery(); autoSave(); }
  function showEditor() { state.view = 'editor'; galleryView.classList.add('hide'); editorView.classList.remove('hide'); const s = getActive(); setTopTitle(s ? s.name : '未命名', '编辑中'); autoSave(); }

    });
    html += '<div class="cat-chip add" data-cat="__add__">＋ 分类</div>';
    catBar.innerHTML = html;
  }

  function renderDrawerCatList() {
    const container = $('#drawerCatList');
    if (!container) return;

      html = '<div style="padding: 10px 20px; font-size: 11px; color: var(--ink-3);">暂无分类</div>';

      state.categories.forEach(c => {
        html += `<div class="drawer-item" style="display: inline-flex; align-items: center; justify-content: flex-start; padding: 4px 10px; margin: 0 6px 6px 0; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,0.6); cursor: default; width: fit-content; max-width: 100%;">
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${esc(c.name)}</span>
          <span style="color: var(--danger); cursor: pointer; font-weight: bold; font-size: 12px; margin-left: 6px; padding: 0 4px;" class="del-cat-drawer" data-del-cat="${c.id}">X</span>
        </div>`;
      });

  }

  $('#drawerCatList').addEventListener('click', async e => {
    const delBtn = e.target.closest('.del-cat-drawer');
    if (!delBtn) return;
    const catId = delBtn.dataset.delCat;
    const cat = state.categories.find(c => c.id === catId);
    if (!cat) return;
    
    const snippetCount = state.snippets.filter(s => s.catId === catId).length;
    let msg = '确定要删除分类「' + cat.name + '」吗？';
    if (snippetCount > 0) {
      msg += '\n该分类下有 ' + snippetCount + ' 个代码片段，删除后它们将变为"未分类"。';
    }
    
    const ok = await showModal({title:'删除分类', message: msg, input:false, okText:'删除', danger:true});
    if (!ok) return;
    
    state.categories = state.categories.filter(c => c.id !== catId);
    state.snippets.forEach(s => { if (s.catId === catId) s.catId = ''; });
    
    if (state.activeCat === catId) state.activeCat = 'all';
    saveAll(); renderCatBar(); renderGallery(); renderEdCatSelect();
    renderDrawerCatList();
    showToast('分类已删除');
  });

  function renderGallery() {
    let list = state.snippets;
    if (state.activeCat !== 'all') list = list.filter(s => s.catId === state.activeCat);
    list = list.slice().sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
    let html = '';
    list.forEach(s => {
      const isEmpty = !s.code && !s.collageData;
      const isCollage = s.type === 'collage';
      const hasCover = s.coverImage;
      
      html += '<div class="g-card" data-id="' + s.id + '">';
      if (hasCover) {
        html += '<div class="g-thumb" style="background-image:url(\'' + s.coverImage + '\'); background-size:cover; background-position:center;"></div>';
      } else {
        html += '<div class="g-thumb ' + (isEmpty?'empty':'') + '">' + (isEmpty ? '' : '<iframe sandbox="allow-scripts allow-same-origin" loading="lazy" scrolling="no"></iframe>') + '</div>';
      }
      html += (isCollage ? '<div class="g-badge collage">拼贴</div>' : '<div class="g-badge">代码</div>') + 
              '<div class="g-meta"><div class="g-name">' + esc(s.name) + '</div><div class="g-menu" data-menu="' + s.id + '">...</div></div></div>';
    });
    html += '<div class="g-card add" data-add="1"><div class="plus">＋</div><div class="txt">新建</div></div>';
    
    if (!list.length && state.activeCat === 'all') { galleryGrid.innerHTML = '<div class="g-card add" data-add="1"><div class="plus">＋</div><div class="txt">新建第一段</div></div>'; return; }
    galleryGrid.innerHTML = html;
    
    galleryGrid.querySelectorAll('.g-card[data-id]').forEach(card => {
      const id = card.dataset.id;
      const iframe = card.querySelector('iframe');
      if (!iframe) return; 
      const s = state.snippets.find(x => x.id === id);
      if (!s) return;
      iframe.srcdoc = buildPreviewHtml(getSnippetHtml(s), true);
    });
  }

  function buildPreviewHtml(code, forThumb) {
    const t = (code||'').trim();
    let h = t || '<!doctype html><html><body style="margin:0;height:100%;display:grid;place-items:center;font-family:system-ui;color:#A99BC4;background:#F9F7FD;">没有内容</body></html>';
    const hasH = /<html[\s>]/i.test(h), hasB = /<body[\s>]/i.test(h);
    if (!hasH && !hasB) h = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + h + '</body></html>';
    const inj = '<style id="__cv_bg_reset">html,body{background:transparent !important;}</style>';
    if (h.includes('</head>')) h = h.replace(/<\/head>/i, inj + '</head>');
    else if (h.includes('<body')) h = h.replace(/<body([^>]*)>/i, '<head>' + inj + '</head><body$1>');
    else if (h.includes('<html')) h = h.replace(/<html([^>]*)>/i, '<html$1><head>' + inj + '</head>');
    else h = inj + h;
    if (forThumb) h = h.replace(/<\/head>/i, '<style>html,body{overflow:hidden !important;}</style></head>');
    return h;
  }

  let previewTimer = null;
  function updatePreview(im) {
    clearTimeout(previewTimer);
    const run = () => {
      const h = buildPreviewHtml(editor.value, false);
      previewFallback.classList.remove('show');
      preview.srcdoc = h;
    };
    if (im) run(); else previewTimer = setTimeout(run, 500);
  }

  function applyPreviewBg() {
    const bg = state.previewBg;
    const l = bgLayer;
    l.style.backgroundImage = 'none';
    l.style.backgroundColor = '#FFFFFF';
    if (bg.type === 'image' && bg.imageUrl) { l.style.backgroundImage = 'url("' + bg.imageUrl + '")'; l.style.backgroundColor = '#F9F7FD'; }
    else if (bg.type === 'colorCard' && bg.colorCard) { l.style.backgroundImage = bg.colorCard; l.style.backgroundColor = '#F9F7FD'; }
    else if (bg.type === 'black') { l.style.backgroundColor = '#000000'; }
    else { l.style.backgroundColor = '#FFFFFF'; }
    const b = Math.max(20, Math.min(200, bg.brightness || 100));
    const bl = Math.max(0, Math.min(20, bg.blur || 0));
    l.style.filter = 'brightness(' + b + '%) blur(' + bl + 'px)';
    l.style.transform = 'scale(' + (1 + (bl/100) * 1.5) + ')';
  }

  function openEditor(id) {
    const s = state.snippets.find(x => x.id === id);
    if (!s) return;
    if (s.type === 'collage') { openCollageEditor(s); return; }
    state.activeId = id;
    edName.value = s.name;
    editor.value = s.code;
    renderEdCatSelect();
    edCatBtn.textContent = state.categories.find(c => c.id === s.catId) ? state.categories.find(c => c.id === s.catId).name : '选择分类';
    edPanes.className = 'ed-panes view-' + state.editView;
    document.querySelectorAll('#edSeg button').forEach(b => b.classList.toggle('active', b.dataset.view === state.editView));
    applyPreviewBg();
    updatePreview(true);
    showEditor();
  }
  function renderEdCatSelect() {
    const s = getActive();
    if (s) {
      if (!s.catId || !state.categories.find(c => c.id === s.catId)) {
        edCatBtn.textContent = '选择分类';
        s.catId = '';
      } else {
        edCatBtn.textContent = state.categories.find(c => c.id === s.catId).name;
      }
    }
  }

  function openDrawer() { 
    drawer.classList.add('show'); 
    drawerMask.classList.add('show'); 
    updateDrawerFoot(); 
    renderDrawerCatList();
  }
  function closeDrawer() { drawer.classList.remove('show'); drawerMask.classList.remove('show'); }
  drawerMask.addEventListener('click', closeDrawer);

  // ===================== 抽屉菜单点击（含导入） =====================
  drawer.addEventListener('click', async e => {
    const it = e.target.closest('.drawer-item'); 
    if (!it || it.classList.contains('del-cat-drawer') || it.closest('#drawerCatList')) return;
    const act = it.dataset.act;
    if (!act) return;
    closeDrawer();

    if (act === 'exportPanel') {
      setTimeout(openExportPanel, 220);
    }
    else if (act === 'exportAll') {
      const data = JSON.stringify({
        app: 'SelectWhatYouWant',
        version: 25,
        exportedAt: new Date().toISOString(),
        categories: state.categories,
        snippets: state.snippets,
        previewBg: state.previewBg
      }, null, 2);
      try {
        const blob = new Blob([data], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = rootDoc.createElement('a');
        a.href = url;
        a.download = '笨蔚的代码备份-' + new Date().toISOString().slice(0,10) + '.json';
        a.style.cssText = 'position:fixed;left:-9999px;top:0;';
        rootDoc.body.appendChild(a);
        a.click();
        setTimeout(() => { try { rootDoc.body.removeChild(a); } catch(e) {} URL.revokeObjectURL(url); }, 1500);
        showToast('已导出备份 · ' + state.snippets.length + ' 个片段');
      } catch(err) { showToast('导出失败'); }
    }
    else if (act === 'importAll') {
      // ★ 导入备份
      const input = rootDoc.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = function(e) {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = async function(ev) {
          let data;
          try {
            data = JSON.parse(ev.target.result);
          } catch(err) {
            showToast('文件损坏或不是 JSON');
            return;
          }
          if (!data || !Array.isArray(data.categories) || !Array.isArray(data.snippets)) {
            showToast('这不是本应用的备份文件');
            return;
          }
          const catCount = data.categories.length;
          const snipCount = data.snippets.length;
          const isSameApp = data.app === 'SelectWhatYouWant';

          const ok = await showModal({
            title: '导入备份',
            message: '检测到备份文件：\n· 分类 ' + catCount + ' 个\n· 片段 ' + snipCount + ' 个\n' + 
                     (isSameApp ? '' : '\n（注意：不是本应用的备份，仅同名字段会被读取）') +
                     '\n\n⚠️ 当前设备上的所有数据将被【覆盖】。\n如果当前设备上有重要内容，请先取消，导出一次再导入。',
            input: false,
            okText: '覆盖导入',
            danger: true
          });
          if (!ok) return;

          // 深拷贝并补齐缺失字段
          const newCats = data.categories.map(c => ({
            id: c.id || uid(),
            name: c.name || '未命名'
          }));
          const newSnips = data.snippets.map(s => {
            const item = {
              id: s.id || uid(),
              catId: s.catId || '',
              name: s.name || '未命名',
              type: s.type === 'collage' ? 'collage' : 'code',
              code: s.code || '',
              updatedAt: s.updatedAt || Date.now()
            };
            if (s.collageData) item.collageData = s.collageData;
            if (s.coverImage) item.coverImage = s.coverImage;
            if (s.regex) item.regex = s.regex;
            if (s.regexReplace) item.regexReplace = s.regexReplace;
            if (s.regexTestInput) item.regexTestInput = s.regexTestInput;
            return item;
          });

          state.categories = newCats;
          state.snippets = newSnips;
          if (data.previewBg) state.previewBg = Object.assign({}, state.previewBg, data.previewBg);
          state.activeId = state.snippets[0] ? state.snippets[0].id : null;
          state.activeCat = 'all';

          const r = saveAll();
          if (!r.ok) { showToast('保存失败，可能是存储空间不足'); return; }

          renderCatBar();
          renderGallery();
          renderDrawerCatList();
          updateDrawerFoot();
          setTopTitle(TOP_TITLE, state.snippets.length + ' 个片段');
          showToast('导入成功 · ' + catCount + ' 分类 / ' + snipCount + ' 片段');
        };
        reader.onerror = function() { showToast('读取文件失败'); };
        reader.readAsText(f);
      };
      input.click();
    }
    else if (act === 'diag') {
      diagnoseStorage();
    }
    else if (act === 'clearAll') {
      const ok = await showModal({title:'清空所有数据', message:'所有分类、代码片段都会被永久删除。', input:false, okText:'清空', danger:true});
      if (!ok) return;
      try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(STORAGE_KEY_BACKUP); } catch(e) {}
      initDemo(); saveAll(); renderCatBar(); renderGallery(); renderDrawerCatList(); showToast('已清空');
    }
  });

  function diagnoseStorage() {
    let total = 0; const list = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); const v = localStorage[k] || ''; total += v.length; list.push({key:k, kb:parseFloat((v.length/1024).toFixed(2))}); }
    list.sort((a,b) => b.kb - a.kb);
    console.table(list);
    const cvSize = (localStorage.getItem(STORAGE_KEY) || '').length;
    showModal({title:'存储诊断', message:'CodeVault 占用: ' + (cvSize/1024).toFixed(2) + ' KB\n所有 localStorage 总计: ' + (total/1024).toFixed(2) + ' KB\n\n详细数据已打印到控制台（F12）', input:false, okText:'知道了'});
  }

  btnMenu.addEventListener('click', openDrawer);

  catBar.addEventListener('click', async e => {
    const chip = e.target.closest('.cat-chip'); if (!chip) return;
    const cat = chip.dataset.cat;
    if (cat === '__add__') { await createCategory(); return; }
    state.activeCat = cat; renderCatBar(); renderGallery(); autoSave();
  });

  galleryGrid.addEventListener('click', e => {
    const menuBtn = e.target.closest('[data-menu]');
    if (menuBtn) { e.stopPropagation(); showSnippetMenu(menuBtn.dataset.menu, menuBtn); return; }
    const addCard = e.target.closest('[data-add]');
    if (addCard) { createNewSnippet(); return; }
    const card = e.target.closest('.g-card[data-id]');
    if (card) openEditor(card.dataset.id);
  });

  edName.addEventListener('input', () => { const s = getActive(); if (!s) return; s.name = edName.value || '未命名'; s.updatedAt = Date.now(); setTopTitle(s.name, '编辑中'); autoSave(); });
  
  edCatBtn.addEventListener('click', () => {
    const s = getActive(); if (!s) return;
    showCategoryPicker(s.catId, function(newCatId) {
        if (newCatId !== null) {
            s.catId = newCatId;
            s.updatedAt = Date.now();
            renderEdCatSelect();
            autoSave();
        }
    });
  });

  editor.addEventListener('input', () => { const s = getActive(); if (!s) return; s.code = editor.value; s.updatedAt = Date.now(); autoSave(); updatePreview(); });
  edSeg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.editView = b.dataset.view; edPanes.className = 'ed-panes view-' + state.editView; document.querySelectorAll('#edSeg button').forEach(x => x.classList.toggle('active', x.dataset.view === state.editView)); autoSave(); if (state.editView !== 'code') updatePreview(true); });
  $('#btnRun').addEventListener('click', () => updatePreview(true));
  $('#btnExportCurrent').addEventListener('click', () => { const s = getActive(); if (!s) return; s.code = editor.value; s.name = edName.value || '未命名'; openExportConfirm(s); });
  btnSave.addEventListener('click', () => { const s = getActive(); if (s) { s.code = editor.value; s.name = edName.value || '未命名'; s.catId = edCatBtn.dataset.catId || s.catId; s.updatedAt = Date.now(); } const r = saveAll(); if (r.ok) { btnSave.classList.add('saved'); showToast('已保存 · ' + (r.size/1024).toFixed(2) + ' KB'); setTimeout(() => btnSave.classList.remove('saved'), 1400); setTimeout(showGallery, 400); } else { showToast('保存失败'); } });
  $('#btnBg').addEventListener('click', openBgPanel);
  $('#btnOpenWindow').addEventListener('click', () => { const h = buildPreviewHtml(editor.value, false); try { const blob = new Blob([h], {type:'text/html'}); const url = URL.createObjectURL(blob); rootWin.open(url, '_blank'); setTimeout(() => { try { URL.revokeObjectURL(url); } catch(e) {} }, 5000); } catch(e) { showToast('无法打开'); } });
  preview.addEventListener('load', () => previewFallback.classList.remove('show'));

  shadow.addEventListener('keydown', e => {
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); e.stopPropagation(); btnSave.click(); }
    else if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); updatePreview(true); }
  });

  async function createCategory() {
    const name = await showModal({title:'新建分类', placeholder:'分类名称', value:''});
    if (!name || !name.trim()) return;
    state.categories.push({id: uid(), name: name.trim()});
    autoSave(); renderCatBar(); renderEdCatSelect(); renderDrawerCatList();
  }

  async function createNewSnippet() {
    if (!state.categories.length) {
      const name = await showModal({title:'先创建一个分类', placeholder:'分类名称', value:'默认'});
      if (!name || !name.trim()) return;
      state.categories.push({id: uid(), name: name.trim()});
      renderDrawerCatList();
    }
    const choice = await showTypeChoice();
    if (!choice) return;
    const targetCat = (state.activeCat !== 'all' && state.activeCat !== '__add__') ? state.activeCat : state.categories[0].id;
    const name = await showModal({title:'命名', placeholder:'输入名称', value: choice === 'collage' ? '新拼贴' : '新代码'});
    if (name === null || !name.trim()) return;
    const s = {
      id: uid(), catId: targetCat, name: name.trim(), type: choice,
      code: choice === 'collage' ? '' : '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<style>\n  html,body{margin:0;height:100%;}\n  body{display:grid;place-items:center;background:#F9F7FD;font-family:system-ui;}\n  h1{color:#A69AEA;font-size:28px;letter-spacing:1px;}\n</style>\n</head>\n<body>\n  <h1>Hello</h1>\n</body>\n</html>',
      updatedAt: Date.now()
    };
    if (choice === 'collage') { s.collageData = JSON.stringify({w:600, h:800, bg:'#ffffff', img:'', tp:false, els:[]}); }
    state.snippets.unshift(s);
    state.activeId = s.id;
    autoSave();
    if (choice === 'collage') { setTimeout(() => openCollageEditor(s), 200); }
    else { openEditor(s.id); setTimeout(() => { edName.focus(); edName.select(); }, 100); }
  }

  async function deleteSnippet(id) {
    const s = state.snippets.find(x => x.id === id); if (!s) return;
    const ok = await showModal({title:'删除', message:'「' + s.name + '」将被永久删除。', input:false, okText:'删除', danger:true});
    if (!ok) return;
    state.snippets = state.snippets.filter(x => x.id !== id);
    if (state.activeId === id) state.activeId = state.snippets[0] ? state.snippets[0].id : null;
    autoSave();
    if (state.view === 'editor') showGallery();
    else { renderGallery(); renderCatBar(); }
  }

  async function renameSnippet(id) {
    const s = state.snippets.find(x => x.id === id); if (!s) return;
    const name = await showModal({title:'重命名', value: s.name});
    if (name === null || !name.trim()) return;
    s.name = name.trim(); s.updatedAt = Date.now();
    if (s.id === state.activeId) { edName.value = s.name; setTopTitle(s.name, '编辑中'); }
    autoSave(); renderGallery();
  }

  function showSnippetMenu(id, anchorEl) {
    const s = state.snippets.find(x => x.id === id); if (!s) return;
    const isC = s.type === 'collage';
    const items = [
      {iconImg:ICON_RENAME, label:'重命名', onClick:() => renameSnippet(id)},
      {icon:'', label:'复制一份', onClick:() => { const c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.name = s.name + ' 副本'; c.updatedAt = Date.now(); state.snippets.splice(state.snippets.indexOf(s)+1, 0, c); state.activeId = c.id; autoSave(); renderGallery(); renderCatBar(); }},
      {icon:'', label:'下载为 HTML', onClick:() => { const f = normalizeFilename(s.name, '.html'); showToast(downloadHtml(s, f) ? '已下载：'+f : '下载失败'); }},
      {icon:'', label:'下载为 Word (.docx)', onClick:() => { 
        const f = normalizeFilename(s.name, '.docx'); 
        showToast('正在生成 Word...');
        downloadWord(s, f).then(function() {
          showToast('已下载：' + f);
        }).catch(function(err) {
          showToast('生成失败：' + err.message);
        });
      }}
    ];
    if (isC) items.push({icon:'', label:'打开拼贴编辑器', onClick:() => openCollageEditor(s)});
    items.push({iconImg:ICON_DELETE, label:'删除', danger:true, onClick:() => deleteSnippet(id)});
    showPopupMenu(anchorEl, items);
  }

  function openBgPanel() {
    const bg = state.previewBg;
    const mask = document.createElement('div');
    mask.className = 'cv-modal-mask';
    mask.innerHTML = '<div class="cv-modal"><div class="cv-modal-title">预览背景</div>' +
      '<div class="bg-section"><div class="bg-label">色卡 <span>点击应用</span></div><div class="bg-color-cards" id="colorCards">' +
      COLOR_CARDS.map(c => '<div class="bg-color-card" data-card-id="' + c.id + '" style="background:' + c.css + ';"><div class="cc">✓</div><div class="cn">' + c.name + '</div></div>').join('') +
      '</div></div>' +
      '<div class="bg-section"><div class="bg-label">背景类型</div><div class="bg-type-group">' +
      '<button type="button" class="bg-type-btn" data-type="colorCard">色卡</button>' +
      '<button type="button" class="bg-type-btn" data-type="black">黑底</button>' +
      '<button type="button" class="bg-type-btn" data-type="white">白底</button>' +
      '<button type="button" class="bg-type-btn" data-type="image">图片</button>' +
      '</div></div>' +
      '<div class="bg-section" id="bgImageSection" style="display:none"><div class="bg-label">图片 URL</div><div class="bg-url-row"><input type="text" id="bgImageUrl" placeholder="粘贴图片链接 https://..." value="' + esc(bg.imageUrl || '') + '"><button type="button" id="bgApplyUrl">应用</button></div><div class="bg-img-preview ' + (bg.imageUrl?'show':'') + '" id="bgImgPreview" style="' + (bg.imageUrl ? 'background-image:url(\'' + esc(bg.imageUrl) + '\')' : '') + '"></div></div>' +
      '<div class="bg-section"><div class="bg-label">亮度 <span id="bgBrightnessVal">' + bg.brightness + '%</span></div><input type="range" id="bgBrightness" min="20" max="200" step="1" value="' + bg.brightness + '"></div>' +
      '<div class="bg-section"><div class="bg-label">模糊度 <span id="bgBlurVal">' + bg.blur + 'px</span></div><input type="range" id="bgBlur" min="0" max="20" step="1" value="' + bg.blur + '"></div>' +
      '<div class="cv-modal-actions"><button type="button" id="bgDoneBtn" class="primary">完成</button></div></div>';
    shadow.appendChild(mask);
    const typeBtns = mask.querySelectorAll('.bg-type-btn'), colorCards = mask.querySelectorAll('.bg-color-card'), imageSection = mask.querySelector('#bgImageSection'), imgPreview = mask.querySelector('#bgImgPreview'), urlInput = mask.querySelector('#bgImageUrl'), applyUrlBtn = mask.querySelector('#bgApplyUrl'), bs = mask.querySelector('#bgBrightness'), bsv = mask.querySelector('#bgBrightnessVal'), bl = mask.querySelector('#bgBlur'), blv = mask.querySelector('#bgBlurVal');
    function syncUI() { typeBtns.forEach(b => b.classList.toggle('active', b.dataset.type === bg.type)); colorCards.forEach(c => c.classList.toggle('active', bg.type === 'colorCard' && c.dataset.cardId === bg.colorCard)); imageSection.style.display = bg.type === 'image' ? 'block' : 'none'; }
    syncUI();
    colorCards.forEach(card => card.addEventListener('click', () => { const c = COLOR_CARDS.find(x => x.id === card.dataset.cardId); if (!c) return; bg.type = 'colorCard'; bg.colorCard = c.css; syncUI(); applyPreviewBg(); autoSave(); showToast('已应用：'+c.name); }));
    typeBtns.forEach(b => b.addEventListener('click', () => { bg.type = b.dataset.type; if (bg.type === 'image' && !bg.imageUrl) setTimeout(() => urlInput.focus(), 50); syncUI(); applyPreviewBg(); autoSave(); }));
    function applyImageUrl() { const url = urlInput.value.trim(); bg.imageUrl = url; bg.type = 'image'; imgPreview.style.backgroundImage = url ? 'url(\'' + url + '\')' : ''; imgPreview.classList.toggle('show', !!url); syncUI(); applyPreviewBg(); autoSave(); showToast(url ? '已应用图片' : '已清除'); }
    applyUrlBtn.addEventListener('click', applyImageUrl);
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyImageUrl(); } });
    bs.addEventListener('input', () => { bg.brightness = parseInt(bs.value, 10); bsv.textContent = bg.brightness + '%'; applyPreviewBg(); });
    bs.addEventListener('change', () => autoSave());
    bl.addEventListener('input', () => { bg.blur = parseInt(bl.value, 10); blv.textContent = bg.blur + 'px'; applyPreviewBg(); });
    bl.addEventListener('change', () => autoSave());
    mask.querySelector('#bgDoneBtn').addEventListener('click', () => { autoSave(); mask.remove(); });
    mask.addEventListener('click', e => { if (e.target === mask) { autoSave(); mask.remove(); } });
  }

  (function init() {
    loadAll();
    if (!state.snippets.find(s => s.id === state.activeId)) { state.activeId = state.snippets[0] ? state.snippets[0].id : null; }
    renderCatBar(); renderGallery(); updateDrawerFoot();
    setTopTitle(TOP_TITLE, state.snippets.length + ' 个片段');
    console.log('%c笨蔚的代码储存中… 已就绪', 'color:#000;font-weight:bold;font-size:13px');
  })();
})();
</script>
</body>
</html>
